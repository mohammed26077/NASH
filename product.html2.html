<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NASH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#ffffff;
  padding:15px 30px;
  color:#000000;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo-img{
  height:50px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
  list-style:none;
}

.nav-links a{
  color:#000000;
  text-decoration:none;
}

/* CART ICON */
.cart-btn{
  position:relative;
  cursor:pointer;
  font-size:20px;
}

.cart-count{
  position:absolute;
  top:-8px;
  right:-10px;
  background:#ff0000;
  color:#fff;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:11px;
  font-weight:bold;
}

/* PRODUCT */
.product-container{
  max-width:550px;
  margin:40px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.product-container img{
  width:100%;
  border-radius:15px;
  margin-bottom:15px;
}

.product-container h2{
  font-size:28px;
  margin-bottom:10px;
}

.price{
  font-size:22px;
  font-weight:bold;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
}

.add{
  margin-top:20px;
  background:linear-gradient(135deg,#111,#444);
  color:#fff;
}

.back{
  margin-top:10px;
  background:#e5e5e5;
}

/* CART */
.cart-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:flex-end;
  z-index:2000;

  opacity:0;
  pointer-events:none;
  transition:0.3s;
}

.cart-modal.active{
  opacity:1;
  pointer-events:auto;
}

.cart-content{
  width:380px;
  height:100%;
  background:#fff;
  padding:25px;
  position:relative;
  transform:translateX(100%);
  transition:0.35s;
  display:flex;
  flex-direction:column;
}

.cart-modal.active .cart-content{
  transform:translateX(0);
}

#cart-items{
  flex:1;
  overflow-y:auto;
  margin-top:10px;
  padding-right:5px;
}

.close-cart{
  position:absolute;
  top:15px;
  right:15px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:#f7f7f7;
  padding:12px;
  border-radius:12px;
  margin-top:12px;
}

.cart-img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.cart-info{
  flex:1;
}

.remove-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#111;
  color:#fff;
  border:none;
  flex-shrink:0;
}

/* TOTAL */
#cart-total{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

/* CHECKOUT */
#checkout-btn{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#111,#444);
  color:#fff;
}

/* FORM */
.confirm-form{
  display:none;
  flex-direction:column;
  gap:10px;
  margin-top:15px;
}

.confirm-form input,
.confirm-form textarea{
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* TOAST */
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#000000;
  color:#fff;
  padding:14px 25px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:5000;
}

#toast.show{
  opacity:1;
}

/* MOBILE */
@media(max-width:600px){

  .product-container{
    margin:20px;
  }

  .cart-content{
    width:100%;
  }

}

.checkout-close{
  width:10px;
  height:10px;
  margin-top:10px;
  border-radius:10%;
  background:#111;
  color:#fff;
  border:none;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin-left:auto;
  margin-right:auto;
}
</style>
</head>

<body>

<nav class="navbar">

  <img src="nash1.PNG" class="logo-img">

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>

    <li class="cart-btn" onclick="openCart()">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-count" id="cart-count">0</span>
    </li>
  </ul>

</nav>

<div class="product-container">

  <img id="img">

  <h2 id="name"></h2>

  <p class="price" id="price"></p>

  <label>Size</label>

  <select id="size">
    <option>S</option>
    <option>M</option>
    <option>L</option>
    <option>XL</option>
  </select>

  <label>Color</label>

  <select id="color">
    <option>Black</option>
    <option>White</option>
    <option>Gray</option>
    <option>Blue</option>
  </select>

  <button class="add" onclick="addToCart()">
    Add To Cart
  </button>

  <button class="back" onclick="goHome()">
    ← Back To Home
  </button>

</div>

<div class="cart-modal" id="cart-modal">

  <div class="cart-content">

    <div class="close-cart" onclick="closeCart()">
      <i class="fa-solid fa-xmark"></i>
    </div>

    <h2>Your Cart</h2>

    <div id="cart-items"></div>

    <div id="cart-total">
      Total: $0
    </div>

    <button id="checkout-btn">
      Checkout
    </button>

<button id="checkout-close" type="button" class="checkout-close">
  ✕
</button>

    <form id="confirm-form" class="confirm-form">

      <input id="customer-name" placeholder="Name">

      <input id="customer-phone" placeholder="Phone">

      <textarea id="customer-address" placeholder="Address"></textarea>

      <button type="submit" id="submit-btn">
        Submit
      </button>

    </form>

  </div>
<div id="toast">Order Sent Successfully
</div>

<script>

const params = new URLSearchParams(window.location.search);

const product = {
  name: params.get("name") || "Product",
  price: params.get("price") || "27",
  img: params.get("img") || "nash55.jpg"
};

document.getElementById("name").innerText = product.name;
document.getElementById("price").innerText = "$" + product.price;
document.getElementById("img").src = product.img;

emailjs.init("rouI_Luvi1xNLIFSN");

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const modal = document.getElementById("cart-modal");
const form = document.getElementById("confirm-form");

function updateCart(){

  document.getElementById("cart-count").innerText = cart.length;

  let html = "";
  let total = 0;

  if(cart.length === 0){

    html = `<p class="empty-cart">Your cart is empty</p>`;

  }else{

    cart.forEach((item,i)=>{

      total += Number(item.price);

      html += `
      <div class="cart-item">

        <img src="${item.img}" class="cart-img">

        <div class="cart-info">
          <strong>${item.name}</strong><br>
          <small>${item.size} | ${item.color}</small><br>
          <small>$${item.price}</small>
        </div>

        <button class="remove-btn" onclick="removeItem(${i})">
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>`;
    });
  }

  document.getElementById("cart-items").innerHTML = html;

  document.getElementById("cart-total").innerText =
  "Total: $" + total;

  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(){

  cart.push({
    name: product.name,
    price: product.price,
    img: product.img,
    size: document.getElementById("size").value,
    color: document.getElementById("color").value
  });

  updateCart();

  openCart();
}

function removeItem(i){

  cart.splice(i,1);

  updateCart();
}

function openCart(){
  modal.classList.add("active");
}

function closeCart(){
  modal.classList.remove("active");
}

document.getElementById("checkout-btn").onclick = ()=>{

  form.style.display = "flex";
  document.getElementById("checkout-close").onclick = ()=>{

  form.style.display = "none";

};
};

function showToast(){

  const toast = document.getElementById("toast");

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },3000);
}

form.onsubmit = (e)=>{

  e.preventDefault();

  const name =
  document.getElementById("customer-name").value;

  const phone =
  document.getElementById("customer-phone").value;

  const address =
  document.getElementById("customer-address").value;

  if(!name || !phone || !address){

    alert("Please fill all fields");

    return;
  }

  const submitBtn =
  document.getElementById("submit-btn");

  submitBtn.innerText = "Sending...";
  submitBtn.disabled = true;

  emailjs.send(
    "service_yb8jwpa",
    "template_33ebtkt",
    {
      customer_name:name,
      customer_phone:phone,
      customer_address:address,

      order_details: cart.map(i =>
        `${i.name} | ${i.size} | ${i.color}`
      ).join(" , ")
    }

  ).then(()=>{

    showToast();

    cart = [];

    updateCart();

    form.style.display = "none";

    closeCart();

    submitBtn.innerText = "Submit";

    submitBtn.disabled = false;

    form.reset();

  });
};

function goHome(){

  window.location.href = "index.html";
}

window.onclick = function(e){

  if(e.target === modal){

    closeCart();
  }
}

updateCart();

</script>

</body>
</html>
